{{- if eq (include "dbaas.declarativeRegistration.enabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbaas-operator-credentials-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ template "dbaas-adapter.name" . }}-secret
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbaas-operator-credentials-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbaas-operator-credentials-reader
subjects:
  - kind: ServiceAccount
    name: dbaas-operator
    namespace: {{ required "DBaaS Operator namespace is required" .Values.dbaasAdapter.declarativeRegistration.operatorNamespace | quote }}
{{- end }}
