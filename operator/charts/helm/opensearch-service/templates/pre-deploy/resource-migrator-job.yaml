{{- if .Values.resourceMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-resource-migrator
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-resource-migrator
      restartPolicy: OnFailure
      {{- if .Values.resourceMigration.runAsNonRoot }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: migrator
          env:
            - name: MASTER_PVC_ANNOTATIONS
              value: {{ include "opensearch.master.persistence.annotations" . | fromYaml | toJson | quote }}
            - name: DATA_PVC_ANNOTATIONS
              value: {{ include "opensearch.data.persistence.annotations" . | fromYaml | toJson | quote }}
            - name: ARBITER_PVC_ANNOTATIONS
              value: {{ include "opensearch.arbiter.persistence.annotations" . | fromYaml | toJson | quote }}
          image: {{ template "kubectl.image" . }}
          imagePullPolicy: {{ .Values.resourceMigration.imagePullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              command -v jq >/dev/null 2>&1 || { echo "[resource-migrator] jq is required"; exit 1; }

              KUBECTL="kubectl"
              NS="{{ .Release.Namespace }}"

              patch_deployment_strategy() {
                DEPLOYMENT_NAME="$1"
                DEPLOYMENT_JSON="$($KUBECTL -n "$NS" get deployment "$DEPLOYMENT_NAME" -o json 2>/dev/null || true)"
                if [ -z "$DEPLOYMENT_JSON" ]; then
                  echo "[resource-migrator] Deployment $DEPLOYMENT_NAME does not exist, skipping"
                  return
                fi
                HAS_ROLLING="$(printf '%s' "$DEPLOYMENT_JSON" | jq '.spec.strategy.rollingUpdate != null')"
                if [ "$HAS_ROLLING" = "true" ]; then
                  echo "[resource-migrator] Deployment $DEPLOYMENT_NAME has stale rollingUpdate block, patching to Recreate strategy"
                  if $KUBECTL -n "$NS" patch deployment "$DEPLOYMENT_NAME" \
                      --type=json -p='[{"op":"replace","path":"/spec/strategy/type","value":"Recreate"},{"op":"remove","path":"/spec/strategy/rollingUpdate"}]'; then
                    echo "[resource-migrator] Deployment $DEPLOYMENT_NAME patched successfully"
                  else
                    echo "[resource-migrator][ERROR] Failed to patch deployment $DEPLOYMENT_NAME"
                    exit 1
                  fi
                else
                  echo "[resource-migrator] Deployment $DEPLOYMENT_NAME: no rollingUpdate block, skipping"
                fi
              }

              patch_deployment_strategy "{{ template "opensearch.fullname" . }}-service-operator"
              patch_deployment_strategy "{{ template "opensearch.fullname" . }}-integration-tests"
              patch_deployment_strategy "{{ template "opensearch.fullname" . }}-curator"

              annotate_pvcs() {
                STATEFULSET_NAME="$1"
                DESIRED_ANNOTATIONS="$2"
                ACTUAL_ANNOTATIONS="$3"
                PATCH=$(jq -cn --argjson desired "$DESIRED_ANNOTATIONS" \
                               --argjson old     "$ACTUAL_ANNOTATIONS" '
                        def stale: ($old | keys) - ($desired | keys);

                        reduce stale[] as $key ($desired; .[$key] = null)
                        | { metadata: { annotations: . } }
                ')
                PVCS="$($KUBECTL -n "$NS" get pvc \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                  | grep -E "^pvc-${STATEFULSET_NAME}-[0-9]+$" || true)"
                if [ -z "$PVCS" ]; then
                  echo "[resource-migrator] No PVCs found for statefulset $STATEFULSET_NAME"
                  return 0
                fi
                unset IFS
                for PVC in $PVCS; do
                  echo "[resource-migrator] Annotating PVC $PVC"
                  if $KUBECTL -n "$NS" patch pvc "$PVC" --type=merge -p "$PATCH"; then
                    echo "[resource-migrator] PVC $PVC patched successfully"
                  else
                    echo "[resource-migrator][ERROR] Failed to patch PVC $PVC"
                    exit 1
                  fi
                done
              }

              MASTER_STS_NAME="{{ include "master-nodes" . }}"
              DATA_STS_NAME="{{ template "opensearch.fullname" . }}-data"
              ARBITER_STS_NAME="{{ template "opensearch.fullname" . }}-arbiter"

              STATEFULSET_NAMES="{{ trim (include "opensearch.statefulsetNames" .) }}"

              if [ -z "$STATEFULSET_NAMES" ]; then
                echo "[resource-migrator] No statefulset names configured, nothing to do"
                exit 0
              fi

              IFS=','; for STS_NAME in $STATEFULSET_NAMES; do
                STS_NAME="$(echo "$STS_NAME" | xargs)"
                [ -z "$STS_NAME" ] && continue

                STS_JSON="$($KUBECTL -n "$NS" get statefulset "$STS_NAME" -o json 2>/dev/null || true)"
                if [ -z "$STS_JSON" ]; then
                  echo "[resource-migrator] StatefulSet $STS_NAME does not exist, skipping"
                  continue
                fi

                # 'node.master' env is a marker of OpenSearch 1.x StatefulSets that must be
                # recreated during upgrade to 2.x because ArgoCD merge cannot remove extra envs.
                NODE_MASTER="$(printf '%s' "$STS_JSON" \
                  | jq -r '[.spec.template.spec.containers[].env[]? | select(.name == "node.master")] | length' 2>/dev/null || echo "0")"

                case "$STS_NAME" in
                  "$MASTER_STS_NAME")  DESIRED_PVC_ANN="$MASTER_PVC_ANNOTATIONS" ;;
                  "$DATA_STS_NAME")    DESIRED_PVC_ANN="$DATA_PVC_ANNOTATIONS" ;;
                  "$ARBITER_STS_NAME") DESIRED_PVC_ANN="$ARBITER_PVC_ANNOTATIONS" ;;
                  *)                   DESIRED_PVC_ANN='{}' ;;
                esac
                PVC_ANN_DRIFT=0
                HAS_VCT="$(printf '%s' "$STS_JSON" | jq -r '(.spec.volumeClaimTemplates // []) | length')"
                if [ "$HAS_VCT" -gt 0 ]; then
                  ACTUAL_PVC_ANN="$(printf '%s' "$STS_JSON" | jq -cS '.spec.volumeClaimTemplates[0].metadata.annotations // {}')"
                  DESIRED_PVC_ANN="$(printf '%s' "$DESIRED_PVC_ANN" | jq -cS '.')"
                  if [ "$ACTUAL_PVC_ANN" != "$DESIRED_PVC_ANN" ]; then
                    annotate_pvcs "$STS_NAME" "$DESIRED_PVC_ANN" "$ACTUAL_PVC_ANN"
                    PVC_ANN_DRIFT=1
                  fi
                else
                  echo "[resource-migrator] StatefulSet $STS_NAME has no volumeClaimTemplates, skipping PVC annotation reconciliation"
                fi

                if [ "$NODE_MASTER" -gt 0 ] || [ "$PVC_ANN_DRIFT" -eq 1 ]; then
                  if [ "$NODE_MASTER" -gt 0 ]; then
                    echo "[resource-migrator] StatefulSet $STS_NAME contains 'node.master' env (OpenSearch 1.x)"
                  fi
                  if [ "$PVC_ANN_DRIFT" -eq 1 ]; then
                    echo "[resource-migrator] StatefulSet $STS_NAME volumeClaimTemplates annotations changed (actual=$ACTUAL_PVC_ANN desired=$DESIRED_PVC_ANN)"
                  fi
                  echo "[resource-migrator] Deleting StatefulSet $STS_NAME with --cascade=orphan"
                  if $KUBECTL -n "$NS" delete statefulset "$STS_NAME" --cascade=orphan --ignore-not-found=true; then
                    echo "[resource-migrator] StatefulSet $STS_NAME deleted successfully"
                  else
                    echo "[resource-migrator][ERROR] Failed to delete StatefulSet $STS_NAME"
                    exit 1
                  fi
                else
                  echo "[resource-migrator] StatefulSet $STS_NAME: no recreation needed, skipping"
                fi
              done

              echo "[resource-migrator] done"
          resources:
            limits:
              cpu: {{ .Values.resourceMigration.resources.limits.cpu }}
              memory: {{ .Values.resourceMigration.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resourceMigration.resources.requests.cpu }}
              memory: {{ .Values.resourceMigration.resources.requests.memory }}
          {{- if .Values.resourceMigration.runAsNonRoot }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          {{- end }}
{{- end }}
