{{- if and (not .Values.global.externalOpensearch.enabled) .Values.opensearch.client.enabled }}
{{- if or .Values.opensearch.client.envoyGateway.enabled .Values.opensearch.client.ingress.enabled }}
{{ if  and (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") (eq .Values.PAAS_PLATFORM "KUBERNETES") -}}
{{- if contains "gateway-api-default" (include "gateway.type" .) }}
{{- $fullName := printf "%s" (include "opensearch.fullname" .) }}
{{- $ingressHosts := include "opensearch.ingressHost" . | fromYamlArray }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-httproute
  labels:
    {{- include "opensearch.labels.standard" . | nindent 4 }}
    {{- include "opensearch-service.defaultLabels" . | nindent 4 }}
    deployment.netcracker.com/ingress-type: 'private-network'
    deployment.netcracker.com/ingress-audience-type: 'ops-user'
spec:
  parentRefs:
  {{- include "gateway.parentRefs" (list . .Values.opensearch.client.envoyGateway.parentRefs) | nindent 4 }}

  hostnames:
  {{- if .Values.opensearch.client.envoyGateway.host }}
    - {{ .Values.opensearch.client.envoyGateway.host | quote }}
  {{- else }}
  {{- range $ingressHosts }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}-internal
          group: ""
          kind: Service
          port: 9200
          weight: 1

{{- if (eq (include "opensearch.tlsEnabled" .) "true") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ $fullName }}-backend-tls
  labels:
    {{- include "opensearch.labels.standard" . | nindent 4 }}
    {{- include "opensearch-service.defaultLabels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $fullName }}-internal

  validation:
    {{- if .Values.opensearch.client.envoyGateway.host }}
    hostname: {{ .Values.opensearch.client.envoyGateway.host | quote }}
    {{- else if $ingressHosts }}
    {{- $first := index $ingressHosts 0 }}
    hostname: {{ $first | quote }}
    {{- end }}

    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ include "opensearch.rest-cert-secret-name" . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
