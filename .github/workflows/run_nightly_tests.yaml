name: Run Nightly Opensearch Pipeline

permissions:
  contents: read

on:
  schedule:
    - cron: '0 1 * * *'

jobs:
  Nightly-Opensearch-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/opensearch.yaml@d5786358e2e534552aa82fea2e419fe1e4a88df7 # v1.18.0
    with:
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: 'd5786358e2e534552aa82fea2e419fe1e4a88df7' # v1.18.0 renovate: depName=Netcracker/qubership-test-pipelines
      runner_type: 'ubuntu-latest'
      scope: 'nightly'
      allure: true
      verify_timeout_minutes: 30
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}

